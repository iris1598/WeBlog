name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # AGP 会自动下载所需的 NDK / SDK Platform（runner 已预置 ANDROID_HOME 与许可）
    # release 版用仓库里的 app/weblog.jks 签名，不需要额外 Secrets
    - name: Build debug + release APK
      run: ./gradlew assembleDebug assembleRelease --stacktrace

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: WeBlog-debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: WeBlog-release
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

  # 只有推送 v* 标签时才创建 GitHub Release，并把 release APK 挂上去
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download release APK
      uses: actions/download-artifact@v4
      with:
        name: WeBlog-release
        path: dist

    - name: Rename APK
      run: mv dist/app-release.apk "dist/WeBlog-${GITHUB_REF_NAME}.apk"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" dist/*.apk \
          --repo "${GITHUB_REPOSITORY}" \
          --title "${GITHUB_REF_NAME}" \
          --generate-notes
